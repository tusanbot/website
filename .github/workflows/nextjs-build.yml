name: Build Tusan Website

on:
  push:
    branches:
      - cloudflare-migration
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tusan-website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package for cPanel (validation only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify public build configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as GitHub Actions repository secrets before running this workflow."
            exit 1
          fi
          echo "Required public build configuration is present."

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Diagnose announcement import paths
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Working directory: $(pwd)"
          test -f lib/supabase.ts && echo "FOUND lib/supabase.ts" || (echo "::error::Missing lib/supabase.ts"; exit 1)
          test -f components/admin/AnnouncementForm.tsx && echo "FOUND AnnouncementForm.tsx" || (echo "::error::Missing AnnouncementForm.tsx"; exit 1)
          test -f components/ui/index.ts && echo "FOUND components/ui/index.ts" || (echo "::error::Missing components/ui/index.ts"; exit 1)
          node --version
          npm --version

      - name: Build Next.js standalone output
        env:
          CPANEL_BUILD: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Assemble and validate cPanel release
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js || { echo "::error::Next.js standalone server.js was not generated"; exit 1; }
          test -d .next/static || { echo "::error::Next.js static assets are missing"; exit 1; }
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -a public .next/standalone/public
          fi
          # cPanel's Node application manager is configured to start app.js.
          # This wrapper delegates to Next.js' generated standalone server.
          printf '"use strict";\nrequire("./server.js");\n' > .next/standalone/app.js
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "node_major=22"
            echo "deployment_target=cPanel Node.js application"
          } > .next/standalone/RELEASE-INFO.txt
          tar -czf release-cpanel.tar.gz -C .next/standalone .
          test -s release-cpanel.tar.gz
          tar -tzf release-cpanel.tar.gz > release-cpanel-contents.txt
          grep -Fqx './server.js' release-cpanel-contents.txt
          grep -Fqx './app.js' release-cpanel-contents.txt
          grep -Fq './.next/static/' release-cpanel-contents.txt
          echo "cPanel release archive assembled:"
          ls -lh release-cpanel.tar.gz
          echo "Archive entries: $(wc -l < release-cpanel-contents.txt)"

      - name: Upload cPanel release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tusan-cpanel-release-${{ github.run_number }}-${{ github.sha }}
          path: release-cpanel.tar.gz
          if-no-files-found: error
          retention-days: 14
