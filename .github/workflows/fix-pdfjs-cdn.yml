name: Fix PDF.js CDN

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace PDF.js CDN and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/(main)/tools/pdf-to-word/page.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js')
          s = s.replace('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js')
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-pdfjs-cdn.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(main)/tools/pdf-to-word/page.tsx' '.github/workflows/fix-pdfjs-cdn.yml'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: switch PDF.js to jsDelivr CDN'
          git push
