name: MySQL pilot lockfile and install check

on:
  push:
    branches:
      - migration/blog-mysql-pilot
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/mysql-pilot-lockfile.yml
      - app/(main)/mysql-test/page.tsx
      - scripts/migrate-blog-to-mysql.mjs
      - database/mysql/blog-pilot-schema.sql
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/mysql-pilot-lockfile.yml
      - app/(main)/mysql-test/page.tsx
      - scripts/migrate-blog-to-mysql.mjs
      - database/mysql/blog-pilot-schema.sql
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mysql-pilot-lockfile
  cancel-in-progress: false

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: migration/blog-mysql-pilot
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock from package.json
        if: github.event_name != 'pull_request'
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if it changed
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync MySQL pilot package lock"
            git push origin HEAD:migration/blog-mysql-pilot
          else
            echo "package-lock.json is already synchronized."
          fi

      - name: Verify clean dependency installation
        run: npm ci

      - name: Verify mysql2 can be imported
        run: node --input-type=module -e "import('mysql2/promise').then(() => console.log('mysql2 import OK'))"

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: pilot-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: pilot-build-placeholder
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: pilot
          MYSQL_PASSWORD: pilot
          MYSQL_DATABASE: pilot
