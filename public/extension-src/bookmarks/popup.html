<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>بوکمارک‌های کافی‌نت توسن</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="brand"><span class="logo">ت</span><div><h1>بوکمارک‌های کافی‌نت</h1><p>مجموعه خدمات کاربردی توسن</p></div></div></header>
<main><label class="field-label" for="rootName">نام پوشه اصلی در نوار بوکمارک</label><input id="rootName" value="خدمات کافی‌نت توسن" maxlength="60"><div class="toolbar"><button id="selectAll" class="secondary">انتخاب همه</button><button id="selectNone" class="secondary">لغو انتخاب همه</button></div><div id="groups" class="groups"></div><div class="summary"><span>تعداد سایت‌های انتخاب‌شده</span><strong id="count">0</strong></div><button id="add" class="primary">افزودن بوکمارک‌های انتخاب‌شده</button><div id="status" role="status" aria-live="polite"></div><p class="note">بوکمارک‌های موجود در سایر پوشه‌ها حذف یا جابه‌جا نمی‌شوند. برای ابزارهای سایت توسن، لینک مستقیم هر ابزار در نظر گرفته شده است.</p></main><script src="popup.js"></script></body></html>
